[build]
  publish = "dist_netlify"
  command = "echo 'Static test automation reports and showcase ready'"

[build.environment]
  PYTHON_VERSION = "3.11.9"
  # Newer mise releases require GitHub artifact attestations for Python builds,
  # which are not published for 3.11.9. Disable that check so install succeeds.
  MISE_PYTHON_GITHUB_ATTESTATIONS = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
