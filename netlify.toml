[build]
  publish = "dist_netlify"
  command = "echo 'Static test automation reports and showcase ready'"

[build.environment]
  PYTHON_VERSION = "3.11.9"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
